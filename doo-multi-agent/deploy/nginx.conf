# ===========================================================================
# Nginx 反向代理 —— doo-multi-agent
#
# 安装:  cp deploy/nginx.conf /etc/nginx/conf.d/doo-multi-agent.conf
#        nginx -t && systemctl reload nginx
#
# 证书:  certbot --nginx -d doo.example.com
#        （certbot 会自动补全 443 段并配置续期）
#
# 把 doo.example.com 换成你自己的域名；不要用 IP 裸跑对外提供服务。
# ===========================================================================

# 上游：应用容器 / 本地 node 进程
upstream doo_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ---- HTTP：仅用于 ACME 校验与跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name doo.example.com;

    # Let's Encrypt 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：正式入口 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doo.example.com;

    ssl_certificate     /etc/letsencrypt/live/doo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 幼儿数据属于敏感个人信息，务必开启 HSTS 强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;

    # STT 接口单次可上传 30MB 音频（web/server/index.ts limit: '30mb'）
    client_max_body_size 32m;

    # 前端静态资源带着 hash 文件名，可以放心长缓存（由 Node 托管）
    location /assets/ {
        proxy_pass http://doo_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://doo_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 单次评估要串行调用 3 个智能体（实测约 4s，线上可能更久），
        # 对话轮次同理；超时给足，避免网关先于业务报 504
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 关闭缓冲，让对话类响应更快回吐
        proxy_buffering off;
    }
}
